[package]
name = "osm_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI bridge over the OSM SDK for Basecamp modules"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
osm_registry_core = { workspace = true }
osm_sdk = { path = "../osm_sdk", features = ["test-util"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
