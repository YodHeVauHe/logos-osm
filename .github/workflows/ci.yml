name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_geofabrik:
        description: "Also run the live Geofabrik host test"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: e2e (in-memory)
        run: cargo test -p osm_e2e --features e2e

  chain:
    name: chain (guest build, deploy, on-chain e2e, cycles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RISC0 toolchain (rzup)
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install rust
          "$HOME/.risc0/bin/rzup" install cargo-risczero
          "$HOME/.risc0/bin/rzup" install r0vm
      - name: Build guest (deterministic, docker)
        id: pid
        run: |
          make build 2>&1 | tee build.log
          PID=$(grep -oE 'ProgramId: [0-9a-f]{64}' build.log | head -1 | cut -d' ' -f2)
          test -n "$PID" || { echo "::error::Program ID was not derived"; exit 1; }
          echo "program_id=$PID" >> "$GITHUB_OUTPUT"
          echo "Program ID: $PID"
      - name: Generate IDL
        run: make idl
      - name: IDL freshness (warning until the generated IDL is committed)
        run: |
          git diff --exit-code idl/             || echo "::warning::IDL differs from the committed file — idl artifact holds the fresh copy"
      - uses: actions/upload-artifact@v4
        with:
          name: idl
          path: idl/osm-registry.idl.json
      - name: Install lgs (logos-scaffold)
        run: cargo install --locked --git https://github.com/logos-co/logos-scaffold logos-scaffold
      - name: Start localnet
        run: |
          lgs setup
          lgs localnet start
          lgs localnet status
      - name: Deploy registry
        run: lgs deploy
      - name: Mint signer + initialize registry
        run: |
          lgs wallet -- account new public
          lgs wallet topup 1
      - name: On-chain e2e (host → query → download)
        env:
          LGS_LOCALNET: "1"
          OSM_PROGRAM_ID: ${{ steps.pid.outputs.program_id }}
        run: cargo test -p osm_e2e --features e2e -- --nocapture
      - name: Capture cycle counts (register / register_batch)
        run: |
          lgs localnet logs --tail 500 > localnet.log || true
          grep -o "CU register[a-z_]* cycles=[0-9]*" localnet.log | tee cycles.txt || true
          {
            echo "# Measured cycle counts"
            echo ""
            '```'
            cat cycles.txt
            '```'
          } > docs/cycles.md
      - uses: actions/upload-artifact@v4
        with:
          name: cycles
          path: docs/cycles.md

  nix:
    name: nix (Basecamp module + app)
    # macOS produces dylibs, not .so — the vendored FFI build is Linux-only
    # for now; macOS coverage is validated from source by the rust matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v13
      - name: Build FFI cdylib (vendored for the module)
        run: |
          cargo build --release -p osm_ffi
          mkdir -p osm-module/lib
          cp target/release/libosm_ffi.so osm-module/lib/
      - name: Build osm core module
        run: nix build .#osm-install
      - name: Build osm-app QML module
        run: nix build .#osm-app-install

  live-geofabrik:
    name: live Geofabrik host (dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_geofabrik }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Live import smoke (checksum verification against real Geofabrik)
        run: |
          cargo build -p osm_cli
          # Fetch a real .md5 for a small region and import synthetic bytes
          # against it to prove the live checksum path; full PBF hosting is
          # an operator task (see README), not a CI one.
          curl -fsSL "https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf.md5" -o /tmp/live.md5
          echo "live md5: $(cat /tmp/live.md5)"
