name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_geofabrik:
        description: "Also run the live Geofabrik host test"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: e2e (in-memory)
        run: cargo test -p osm_e2e --features e2e

  chain:
    name: chain (LEZ v0.3.1 sequencer, deploy, on-chain e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y clang libclang-dev libpcsclite-dev libssl-dev pkg-config cmake
          libclang="$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' | sort -V | tail -n 1)"
          test -n "$libclang"
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
      - name: Checkout LEZ v0.3.1
        run: git clone --depth 1 --branch v0.3.1 https://github.com/logos-blockchain/logos-execution-zone.git /tmp/lez
      - name: Build LEZ v0.3.1 sequencer and wallet
        working-directory: /tmp/lez
        env:
          BINDGEN_EXTRA_CLANG_ARGS: -I/usr/include
        run: |
          cargo build --features standalone -p sequencer_service
          cargo build -p wallet
      - name: Install RISC Zero guest toolchain
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install rust
          "$HOME/.risc0/bin/rzup" install r0vm
      - name: Build registry guest
        run: make build
      - name: Generate IDL
        run: make idl
      - name: IDL freshness
        run: git diff --exit-code -- idl/osm-registry.idl.json
      - name: Deploy and exercise registry on LEZ v0.3.1
        env:
          LEZ_ROOT: /tmp/lez
          LEZ_WALLET_BIN: /tmp/lez/target/debug/wallet
          LEZ_SEQUENCER_BIN: /tmp/lez/target/debug/sequencer_service
        run: tools/run_localnet_registry_e2e.sh

  nix:
    name: nix (Basecamp module + app)
    # macOS produces dylibs, not .so — the vendored FFI build is Linux-only
    # for now; macOS coverage is validated from source by the rust matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v13
      - name: Build FFI cdylib (vendored for the module)
        run: |
          cargo build --release -p osm_ffi
          mkdir -p osm-module/lib
          cp target/release/libosm_ffi.so osm-module/lib/
      - name: Build osm core module
        run: nix build .#osm-install
      - name: Build osm-app QML module
        run: nix build .#osm-app-install

  live-geofabrik:
    name: live Geofabrik host (dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_geofabrik }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Live import smoke (checksum verification against real Geofabrik)
        run: |
          cargo build -p osm_cli
          # Fetch a real .md5 for a small region and import synthetic bytes
          # against it to prove the live checksum path; full PBF hosting is
          # an operator task (see README), not a CI one.
          curl -fsSL "https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf.md5" -o /tmp/live.md5
          echo "live md5: $(cat /tmp/live.md5)"
