name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_geofabrik:
        description: "Also run the live Geofabrik host test"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: e2e (in-memory)
        run: cargo test -p osm_e2e --features e2e

  chain:
    name: chain (guest build, deploy, on-chain e2e, cycles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install RISC0 toolchain (rzup)
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install rust
          "$HOME/.risc0/bin/rzup" install cargo-risczero
          "$HOME/.risc0/bin/rzup" install r0vm
      - name: Build guest (deterministic, docker)
        id: pid
        run: |
          make build 2>&1 | tee build.log
          PID=$(grep -oE 'ProgramId: [0-9a-f]{64}' build.log | head -1 | cut -d' ' -f2)
          test -n "$PID" || { echo "::error::Program ID was not derived"; exit 1; }
          echo "program_id=$PID" >> "$GITHUB_OUTPUT"
          echo "Program ID: $PID"
      - name: Generate IDL
        run: make idl
      - name: IDL freshness
        run: |
          git diff --exit-code -- idl/osm-registry.idl.json
      - uses: actions/upload-artifact@v4
        with:
          name: idl
          path: idl/osm-registry.idl.json
      - name: Install lgs (logos-scaffold)
        run: cargo install --locked --git https://github.com/logos-co/logos-scaffold logos-scaffold
      - name: Start localnet
        run: |
          PYTHON_LIBDIR=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
          LIBRARY_PATH="$PYTHON_LIBDIR" LD_LIBRARY_PATH="$PYTHON_LIBDIR" lgs setup
          lgs localnet start
          lgs localnet status
      - name: Build registry instruction client
        run: |
          PYTHON_LIBDIR=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
          LIBRARY_PATH="$PYTHON_LIBDIR" LD_LIBRARY_PATH="$PYTHON_LIBDIR" make cli
      - name: Deploy registry
        run: lgs deploy --program-path methods/guest/target/riscv32im-risc0-zkvm-elf/osm_registry.bin
      - name: Derive local signer account
        id: signer
        run: |
          ADDRESS=$(LOGOS_SCAFFOLD_QUIET=1 lgs wallet -- account new public --label lp0018-e2e \
            | python -c 'import re,sys; m=re.search(r"Generated new account with account_id (Public/[1-9A-HJ-NP-Za-km-z]+)", sys.stdin.read()); assert m, "lgs did not print the new public account"; print(m.group(1))')
          lgs wallet topup "$ADDRESS" --json
          echo "account_id=$ADDRESS" >> "$GITHUB_OUTPUT"
      - name: On-chain registry e2e (host → register → query)
        env:
          LGS_LOCALNET: "1"
          OSM_PROGRAM_ID: ${{ steps.pid.outputs.program_id }}
          OSM_CLI_BIN: ${{ github.workspace }}/examples/target/debug/osm_registry_cli
          OSM_IDL_PATH: ${{ github.workspace }}/idl/osm-registry.idl.json
          LGS_BIN: lgs
          LEE_WALLET_HOME_DIR: ${{ github.workspace }}/.scaffold/wallet
          OSM_SIGNER_ACCOUNT_ID: ${{ steps.signer.outputs.account_id }}
        run: |
          PYTHON_LIBDIR=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
          LIBRARY_PATH="$PYTHON_LIBDIR" LD_LIBRARY_PATH="$PYTHON_LIBDIR" \
            cargo test -p osm_e2e --features e2e localnet_registry_host_query -- --nocapture
      - name: Capture cycle counts (register / register_batch)
        run: |
          lgs localnet logs --tail 500 > localnet.log
          grep -E 'CU register_region entries=1 cycles=[1-9][0-9]*' localnet.log > cycles.txt
          grep -E 'CU register_batch entries=2 cycles=[1-9][0-9]*' localnet.log >> cycles.txt
          grep -q 'CU register_region entries=1 cycles=[1-9][0-9]*' cycles.txt
          grep -q 'CU register_batch entries=2 cycles=[1-9][0-9]*' cycles.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cycles
          path: cycles.txt
      - name: Stop localnet
        if: always()
        run: lgs localnet stop

  nix:
    name: nix (Basecamp module + app)
    # macOS produces dylibs, not .so — the vendored FFI build is Linux-only
    # for now; macOS coverage is validated from source by the rust matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v13
      - name: Build FFI cdylib (vendored for the module)
        run: |
          cargo build --release -p osm_ffi
          mkdir -p osm-module/lib
          cp target/release/libosm_ffi.so osm-module/lib/
      - name: Build osm core module
        run: nix build .#osm-install
      - name: Build osm-app QML module
        run: nix build .#osm-app-install

  live-geofabrik:
    name: live Geofabrik host (dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_geofabrik }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Live import smoke (checksum verification against real Geofabrik)
        run: |
          cargo build -p osm_cli
          # Fetch a real .md5 for a small region and import synthetic bytes
          # against it to prove the live checksum path; full PBF hosting is
          # an operator task (see README), not a CI one.
          curl -fsSL "https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf.md5" -o /tmp/live.md5
          echo "live md5: $(cat /tmp/live.md5)"
