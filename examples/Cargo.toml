[package]
name = "osm_registry-examples"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "osm_registry_cli"
path = "src/bin/osm_registry_cli.rs"

[dependencies]
anyhow = "1"
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1", features = ["host"] }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
osm_registry_core = { path = "../osm_registry_core" }
borsh = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
risc0-zkvm = "=3.0.5"
risc0-zkos-v1compat = "=2.2.2"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
